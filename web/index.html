<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silinx ISE Project Navigator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='%23c4161c'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/asm-editor.css">
<link rel="stylesheet" href="/css/schematic.css">
<link rel="stylesheet" href="/css/isim.css">
<link rel="stylesheet" href="/css/sch-editor.css">
<link rel="stylesheet" href="/css/truthtable.css">
<link rel="stylesheet" href="/css/fsm-editor.css">
<link rel="stylesheet" href="/css/petri-editor.css">
<link rel="stylesheet" href="/css/fpgaview.css">
<link rel="stylesheet" href="/css/modern.css">
<link rel="stylesheet" href="/css/tasks.css">
<link rel="stylesheet" href="/css/messages.css">
<script>/* the interface (modern | classic | tasks) and theme before the first paint: web/js/modern.js (tasks in a
   development build only, #838: its <html data-dev>, or the build's data a test gives) */
(function () { var d = document.documentElement, ui = 'modern', th = 'system', dev = d.hasAttribute('data-dev') || !!window.__SILINX_BUILD__;
  try { ui = localStorage.getItem('silinx.ui'); ui = ui === 'classic' || (ui === 'tasks' && dev) ? ui : 'modern'; th = localStorage.getItem('silinx.theme') || 'system'; } catch (e) {}
  var dark = th === 'dark' || (th !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  d.setAttribute('data-ui', ui === 'tasks' ? 'modern' : ui); if (ui === 'tasks') d.setAttribute('data-layout', 'tasks');
  d.setAttribute('data-theme', ui !== 'classic' && dark ? 'dark' : 'light');
  /* narrow screens: the left side's drawer as the viewer left it (web/js/narrow.js, #266) */
  var dr = 'open'; try { dr = localStorage.getItem('silinx.drawer') === 'closed' ? 'closed' : 'open'; } catch (e) {}
  d.setAttribute('data-drawer', dr); })();
</script>
<!-- the editor (CodeMirror 6, web/js/editor.js): its ES modules, from node_modules (server/server.js
     serves these packages only; the standalone edition bundles them, scripts/build-standalone.mjs) -->
<script type="importmap">
{ "imports": {
  "@codemirror/state": "/vendor/npm/@codemirror/state/dist/index.js",
  "@codemirror/view": "/vendor/npm/@codemirror/view/dist/index.js",
  "@codemirror/language": "/vendor/npm/@codemirror/language/dist/index.js",
  "@codemirror/streamparser": "/vendor/npm/@codemirror/streamparser/dist/index.js",
  "@codemirror/commands": "/vendor/npm/@codemirror/commands/dist/index.js",
  "@codemirror/search": "/vendor/npm/@codemirror/search/dist/index.js",
  "@codemirror/autocomplete": "/vendor/npm/@codemirror/autocomplete/dist/index.js",
  "@codemirror/lint": "/vendor/npm/@codemirror/lint/dist/index.js",
  "@codemirror/legacy-modes/mode/vhdl": "/vendor/npm/@codemirror/legacy-modes/mode/vhdl.js",
  "@codemirror/legacy-modes/mode/verilog": "/vendor/npm/@codemirror/legacy-modes/mode/verilog.js",
  "@lezer/common": "/vendor/npm/@lezer/common/dist/index.js",
  "@lezer/highlight": "/vendor/npm/@lezer/highlight/dist/index.js",
  "@marijn/find-cluster-break": "/vendor/npm/@marijn/find-cluster-break/src/index.js",
  "crelt": "/vendor/npm/crelt/index.js",
  "style-mod": "/vendor/npm/style-mod/src/style-mod.js",
  "w3c-keyname": "/vendor/npm/w3c-keyname/index.js"
} }
</script>
<script src="/vendor/elk/elk.bundled.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="titlebar"><button id="drawer-btn" class="m-icon-btn" title="Show / hide the side panel (Design, Files, Processes)" aria-label="Show / hide the side panel (Design, Files, Processes)" aria-controls="left" aria-expanded="true"><span class="ico-inline" data-icon="mPanel"></span></button><span class="app-logo" data-no-i18n>S</span><span id="title-text">Project Navigator</span></div>
    <nav id="menubar" aria-label="Main menu"></nav>
    <div id="top-actions">
      <button id="palette-btn" class="m-search" title="Search commands and files (Ctrl+K)"><span class="ico-inline" data-icon="mSearch"></span><span class="m-search-text">Search commands and files…</span><kbd id="palette-kbd" data-no-i18n>Ctrl K</kbd></button>
      <button id="theme-btn" class="m-icon-btn" title="Switch between light and dark theme" aria-label="Switch between light and dark theme"><span class="ico-inline m-sun" data-icon="mSun"></span><span class="ico-inline m-moon" data-icon="mMoon"></span></button>
    </div>
  </header>
  <div id="toolbar"></div>
  <div id="main">
    <div id="left">
      <div id="left-pages">
        <div class="left-page" data-page="design">
          <div class="ise-panel" id="design-panel">
            <div class="caption"><span>Design</span><span class="spacer"></span></div>
            <div class="view-select">
              <span>View:</span>
              <label><input type="radio" name="view" value="impl" checked> <span class="ico-inline" data-icon="chip"></span>Implementation</label>
              <label><input type="radio" name="view" value="sim"> <span class="ico-inline" data-icon="sim"></span>Simulation</label>
            </div>
            <div class="hier-caption">Hierarchy</div>
            <div class="body" id="hier"></div>
          </div>
          <div id="left-split"></div>
          <div class="ise-panel" id="proc-panel">
            <div class="caption"><span id="proc-caption">Processes:</span><span class="spacer"></span></div>
            <div class="body" id="procs"></div>
          </div>
        </div>
        <div class="left-page" data-page="start" hidden><div class="ise-panel fill"><div class="caption">Start</div><div class="body" id="start-page"></div></div></div>
        <div class="left-page" data-page="files" hidden><div class="ise-panel fill"><div class="caption">Files</div><div class="body" id="files-page"></div></div></div>
        <div class="left-page" data-page="libraries" hidden><div class="ise-panel fill"><div class="caption">Libraries</div><div class="body" id="libs-page"></div></div></div>
      </div>
      <div id="left-tabs" class="bottom-tabs" role="tablist" aria-label="Panels">
        <div class="tab" data-page="start" role="tab" tabindex="0"><span class="ico-inline tab-ico" data-icon="mHome"></span><span class="tab-lbl">Start</span></div>
        <div class="tab active" data-page="design" role="tab" tabindex="0"><span class="ico-inline tab-ico" data-icon="mDesign"></span><span class="tab-lbl">Design</span></div>
        <div class="tab" data-page="files" role="tab" tabindex="0"><span class="ico-inline tab-ico" data-icon="mFiles"></span><span class="tab-lbl">Files</span></div>
        <div class="tab" data-page="libraries" role="tab" tabindex="0"><span class="ico-inline tab-ico" data-icon="mLibrary"></span><span class="tab-lbl">Libraries</span></div>
      </div>
    </div>
    <div id="v-split"></div>
    <div id="drawer-scrim"></div>
    <div id="center">
      <div id="workspace"><div id="ws-empty"><div class="ws-logo">S</div><h2>Silinx ISE</h2>
        <p>Open a source from the Design panel, or search for any command or file.</p>
        <div class="ws-keys"><span><kbd data-no-i18n class="pal-key">Ctrl K</kbd> <span>Search commands and files</span></span></div></div></div>
      <div id="doc-tabs" class="bottom-tabs"></div>
    </div>
  </div>
  <div id="h-split"></div>
  <div id="console-wrap" class="ise-panel">
    <div class="caption"><span id="console-caption">Console</span><span class="spacer"></span>
      <button class="tb-btn" id="console-clear" title="Clear">⌫</button></div>
    <div class="body" id="console-body">
      <div class="console-page" data-page="console" id="console-log"></div>
      <div class="console-page" data-page="errors" id="console-errors" hidden></div>
      <div class="console-page" data-page="warnings" id="console-warnings" hidden></div>
    </div>
    <div id="console-tabs" class="bottom-tabs">
      <div class="tab active" data-page="console"><span class="ico-inline" data-icon="console"></span>Console</div>
      <div class="tab" data-page="errors"><span class="ico-inline" data-icon="err"></span>Errors <span class="count" id="err-count"></span></div>
      <div class="tab" data-page="warnings"><span class="ico-inline" data-icon="warn"></span>Warnings <span class="count" id="warn-count"></span></div>
    </div>
  </div>
  <div id="statusbar"><span id="status-text">Ready</span><span class="spacer"></span><span id="status-pos"></span><span id="status-device"></span><span id="status-storage"></span></div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
