# Dependabot (#352): newer versions of the open-source software Silinx uses, weekly, in few pull requests.
#   - npm: the minor and patch updates of CodeMirror (@codemirror/*, @lezer/*), express, elkjs, esbuild and
#     playwright in one pull request; @yowasp/yosys (Yosys) never grouped: a pull request of its own, which
#     .github/workflows/yosys-update.yml labels "yosys update" and measures (the new Yosys against the
#     base's), and which is never merged on green alone (CLAUDE.md, Integration)
#   - GitHub Actions: every action of the workflows and of the setup action in one pull request; the actions are
#     pinned by commit, their version in a comment (#414), which Dependabot updates with the commit
#   - Docker: the Vitis HLS image's base (scripts/vitis-hls-image/Dockerfile), pinned by its digest (#2645), which
#     Dependabot updates with the digest within Ubuntu 22.04 (the release Vivado supports); the ISE image's
#     Ubuntu 14.04 (docker/ise/) has no new digest to come (end of life), and is left out
# @silinx/nextpnr-himbaechel-spartan3e (nextpnr, #2136) is pinned by its version on npm (#2307), which Dependabot updates,
# never grouped: a pull request of its own, which .github/workflows/nextpnr-update.yml labels "nextpnr update" and
# measures (the examples with the new nextpnr against the base's), never merged on green alone (#2935); -spartan6 (#2138)
# is still pinned by its release's URL (pmnmalo/nextpnr-spartan), which Dependabot does not update: the monthly Pins
# check lists a newer release (#2934), pinned by hand in a pull request the same workflow measures.
# Sources pinned outside npm (Yosys's test designs, the design corpus, the MCC models): the monthly
# .github/workflows/pins.yml (scripts/check-pins.mjs).
# elkjs is no longer ignored (0.9 to 0.12 in #351): a 0.x minor update may change the schematic layout;
# its pull request runs test/hdl-to-sch.test.js, which checks every example's Convert to Schematic.
# A dependency update changes NOTICE / THIRD-PARTY-NOTICES when its licence or authors change (CLAUDE.md).
# An npm version is proposed a week after it is published (cooldown, #1436): a compromised version is usually
# found and pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      npm-minor-patch:
        patterns: ['@codemirror/*', '@lezer/*', '@yowasp/nextpnr-ice40', express, elkjs, esbuild, playwright, ws, y-protocols, yjs]
        update-types: [minor, patch]
    # (no update ignored)
    # CodeMirror: on 6 since #349, its major updates no longer ignored
    # Express: on 5 since #350, its major updates no longer ignored
    # elkjs: on 0.12 since #351, no longer ignored
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /scripts/vitis-hls-image
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: [dependencies]
    ignore:
      # Ubuntu 22.04 stays (Vivado ML 2025's): only its digest is updated
      - dependency-name: ubuntu
        update-types: [version-update:semver-major, version-update:semver-minor]
