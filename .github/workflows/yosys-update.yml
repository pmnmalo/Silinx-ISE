name: Yosys update
# A pull request that changes Yosys (@yowasp/yosys: Dependabot's, labelled "yosys update", or anyone's) is
# reviewed, never merged on green alone (#352, CLAUDE.md, Integration). This workflow gives the decision its
# data: the open synthesis of the examples and of a representative subset of the design corpus (slices,
# LUTs, flip-flops, the critical path by Silinx's STA) with the new Yosys and with the base branch's (the
# same code, this pull request's: only @yowasp/yosys differs, the base's version installed over it), and
# Yosys's test designs (test/corpus, in two jobs as the nightly) against test/corpus/expected.json: one
# table of the differences (scripts/yosys-update-report.mjs).
#
# The table goes to the job summary and to the artifact yosys-update-report always, and to a comment on the
# pull request (one, updated by later runs) when the token may comment. A Dependabot pull request's workflow
# can get a read-only GITHUB_TOKEN (a fork's always does): then there is no comment, and the summary is
# enough (no pull_request_target: a fork's code never runs with a writing token).
#
# GitHub's runners only: a pull request's code never runs on the self-hosted ISE runner (the repository is
# public). The comparison with ISE runs after merging, by hand (Actions ▸ Quality ▸ Run workflow).
on:
  pull_request:
    paths: [package.json, package-lock.json]
permissions:
  contents: read
concurrency:
  group: yosys-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # whether the pull request changes @yowasp/yosys (the paths above are any change of package.json): its
  # version in the base's package.json / package-lock.json against the pull request's; labelled
  # "yosys update" (Dependabot's labels are per ecosystem: the label is set here; with a read-only token it
  # is not, which changes nothing else). The steps that hold a writing token run the base's code (#1440): the
  # pull request's own scripts run only where the token reads, and what they write (the versions) is checked
  # by a step of this file before it reaches a command. Here the base is at the workspace's root and the pull
  # request under head/, read as data (#3038): a bare import of the base's script resolves upward from the
  # root, never into the pull request's tree, which may hold a node_modules of its own.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      base: ${{ steps.v.outputs.base }}
      head: ${{ steps.v.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      # no node_modules the base's script could import from (none installed: the base's checkout is its code alone)
      - run: test ! -e node_modules
      # the base's script reads both sides' package.json / package-lock.json
      - id: v
        run: node scripts/yosys-update-report.mjs versions package.json package-lock.json head/package.json head/package-lock.json
      - if: steps.v.outputs.changed == 'true'
        continue-on-error: true
        run: gh pr edit "$PR_NUMBER" --add-label "yosys update"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  # the open synthesis with each Yosys: the examples through the open flow (packages/silinx-fpga/research/s3e-route/open-flow.mjs
  # --quality), the subset of the design corpus through test/designs-corpus/run.mjs (frontend, synth, flow;
  # its comparison with expected.json is not this job's verdict: the report compares the two sides). A side per job: what it
  # compares (the size, the critical path by Silinx's STA) is the same on any runner; a run time would not be (#3030: both
  # sides in one job, alternated and repeated, as nextpnr-update.yml measures them)
  measure:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: measure (${{ matrix.side }})
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # a version and nothing else (not an npm: alias, not a tag) before it reaches npm install: the check job's
      # output, this file's own check (#1440)
      - name: The base's version checked
        if: matrix.side == 'base'
        env:
          BASE_VERSION: ${{ needs.check.outputs.base }}
        run: |
          [[ "$BASE_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::@yowasp/yosys: the base's version is not a version: $BASE_VERSION"; exit 1; }
      - name: The base's Yosys
        if: matrix.side == 'base'
        env:
          BASE_VERSION: ${{ needs.check.outputs.base }}
        # into the toolchain's workspace and the root both (#3156): installed at the root only, npm kept the pull
        # request's Yosys nested in packages/silinx-fpga/node_modules, which the toolchain resolves first
        run: npm install --no-save --ignore-scripts --workspace silinx-fpga --include-workspace-root "@yowasp/yosys@$BASE_VERSION"
      # the version the toolchain loads (from packages/silinx-fpga and from the root), the side's or the job fails; not
      # npm ls: the base's version is "invalid" against the pull request's package.json (exit 1)
      - name: Yosys resolved
        env:
          BASE_SPEC: ${{ matrix.side == 'base' && format('@yowasp/yosys@{0}', needs.check.outputs.base) || '@yowasp/yosys' }}
        run: node scripts/resolved-package.mjs packages/silinx-fpga "$BASE_SPEC"
      - name: The examples
        run: |
          mkdir -p "out/examples"
          for ex in gates traffic blinky pong stopwatch clock vga isqrt uart micro80; do
            node packages/silinx-fpga/research/s3e-route/open-flow.mjs "examples/$ex" "$RUNNER_TEMP/flow/$ex" --quality "out/examples/$ex.json" > "out/examples/$ex.log" 2>&1 \
              || echo "::warning::$ex: the open flow failed (out/examples/$ex.log)"
            tail -3 "out/examples/$ex.log"
          done
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/designs-corpus
          key: designs-corpus-${{ hashFiles('test/designs-corpus/manifest.json') }}
      - run: npm run fetch:designs
      - name: The design corpus (a representative subset)
        run: node test/designs-corpus/run.mjs --filter "$(node scripts/yosys-update-report.mjs subset)" --stages frontend,synth,flow --jobs 4 --json out/designs.json || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yosys-${{ matrix.side }}
          path: out
  # Yosys's test designs with the new Yosys against test/corpus/expected.json (recorded with the base's):
  # regressions, newly passing, new warnings; in three jobs, as the nightly (--shard; scripts/yosys-update-report.mjs's CORPUS_SHARDS)
  corpus:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: corpus (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/yosys-tests
          key: yosys-tests-${{ hashFiles('scripts/fetch-yosys-tests.mjs') }}
      - run: npm run fetch:yosys-tests
      - name: Yosys's test designs (Silinx vs Yosys)
        run: npm run test:corpus -- --jobs 4 --shard "$SHARD/3" --json "out/shard-$SHARD.json" || true
        env:
          SHARD: ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yosys-corpus-${{ matrix.shard }}
          path: out
  report:
    needs: [check, measure, corpus]
    if: always() && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # the base's code for every step of this job, whose token writes (#1440): the pull request's code
      # run here could change the files the comment's step runs (#2644)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
      - name: The table of the differences
        env:
          BASE_VERSION: ${{ needs.check.outputs.base }}
          HEAD_VERSION: ${{ needs.check.outputs.head }}
        run: |
          mkdir -p results/corpus
          cp results/yosys-corpus-*/shard-*.json results/corpus/ 2>/dev/null || true
          node base/scripts/yosys-update-report.mjs report --base results/yosys-base --head results/yosys-head --corpus results/corpus \
            --base-version "$BASE_VERSION" --head-version "$HEAD_VERSION" --out yosys-update.md
          cat yosys-update.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yosys-update-report
          path: |
            yosys-update.md
            results
      - name: The pull request's comment
        continue-on-error: true
        run: node base/scripts/yosys-update-report.mjs comment yosys-update.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
