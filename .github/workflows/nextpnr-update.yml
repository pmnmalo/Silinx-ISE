name: nextpnr update
# A pull request that changes a nextpnr package (@silinx/nextpnr-himbaechel-spartan3e, -spartan6: Dependabot's, labelled
# "nextpnr update", or a release of pmnmalo/nextpnr-spartan pinned by hand) is reviewed, never merged on green alone (#2935,
# CLAUDE.md, Integration), as a Yosys update is (yosys-update.yml). This workflow gives the decision its data: every example
# through the application's flow (nextpnr packs, places and routes) on the Basys2-250, the Nexys3 and the Atlys (slices,
# LUTs, flip-flops, the minimum period by Silinx's STA, the run time) with the pull request's packages and with the base
# branch's (the same code, this pull request's: only the nextpnr packages differ, the base's installed over them): one
# table of the differences (scripts/nextpnr-update-report.mjs). Both sides of a board are measured in one job, on one
# runner, alternated and repeated (#3030: a side per job, the runners alone moved the run times by 20-39 %); a board whose
# package does not change is not measured.
#
# The table goes to the job summary and to the artifact nextpnr-update-report always, and to a comment on the pull request
# (one, updated by later runs) when the token may comment (a Dependabot pull request's can be read-only; no
# pull_request_target: a fork's code never runs with a writing token). GitHub's runners only: a pull request's code never
# runs on the self-hosted ISE runner. The check against ISE runs after merging (npm run check:open-flow).
on:
  pull_request:
    paths: [package.json, package-lock.json, packages/silinx-fpga/package.json]
permissions:
  contents: read
concurrency:
  group: nextpnr-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # whether the pull request changes a nextpnr package: the base's package.json / package-lock.json against the pull
  # request's, by the base's script (#1440: the steps that hold a writing token run the base's code); labelled
  # "nextpnr update". The base at the workspace's root and the pull request under head/, read as data (#3038): a bare
  # import of the base's script resolves upward from the root, never into the pull request's tree
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      base: ${{ steps.v.outputs.base }}
      summary: ${{ steps.v.outputs.summary }}
      boards: ${{ steps.v.outputs.boards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # no node_modules the base's script could import from (none installed: the base's checkout is its code alone)
      - run: test ! -e node_modules
      - id: v
        run: node scripts/nextpnr-update-report.mjs versions package.json package-lock.json head/package.json head/package-lock.json
      - if: steps.v.outputs.changed == 'true'
        continue-on-error: true
        run: gh pr edit "$PR_NUMBER" --add-label "nextpnr update"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  # the examples with both sides' packages, a job per board whose package changes and per shard of its examples
  # (scripts/nextpnr-update-report.mjs BOARDS, SHARDS): both sides on the same runner (#3030), the pull request's checkout
  # (its packages) and a copy of it with the base's packages installed over them, measured alternately (base, head, head,
  # base, base, head): three runs of each side, or the pairs that fit the job's time
  measure:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: measure (${{ matrix.board }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.check.outputs.boards || '["basys2-250", "nexys3", "atlys"]') }}
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # a package and a version, or a release of the fork, and nothing else, before it reaches npm install: the check
      # job's output, this file's own check (#1440)
      - name: The base's packages checked
        env:
          BASE_INSTALL: ${{ needs.check.outputs.base }}
        run: |
          for s in $BASE_INSTALL; do
            [[ "$s" =~ ^@silinx/nextpnr-himbaechel-spartan(3e|6)@([0-9]+\.[0-9]+\.[0-9]+|https://github\.com/pmnmalo/nextpnr-spartan/releases/download/[a-z0-9]+-v[0-9]+\.[0-9]+\.[0-9]+/[A-Za-z0-9._-]+\.tgz)$ ]] || { echo "::error::not a nextpnr package's version: $s"; exit 1; }
          done
      # the base's side: the same checkout and dependencies, copied
      - name: The base's side
        run: cp -a . "$RUNNER_TEMP/base"
      # into the toolchain's workspace and the root both (#3156): installed at the root only, npm kept the pull request's
      # package nested in packages/silinx-fpga/node_modules, which the toolchain resolves first
      - name: The base's nextpnr
        working-directory: ${{ runner.temp }}/base
        env:
          BASE_INSTALL: ${{ needs.check.outputs.base }}
        run: |
          [ -z "$BASE_INSTALL" ] || npm install --no-save --ignore-scripts --workspace silinx-fpga --include-workspace-root $BASE_INSTALL
      # the versions the toolchain loads (from packages/silinx-fpga and from the root), each side's or the job fails
      - name: The nextpnr packages resolved
        env:
          BASE_INSTALL: ${{ needs.check.outputs.base }}
        run: |
          node scripts/resolved-package.mjs packages/silinx-fpga @silinx/nextpnr-himbaechel-spartan3e @silinx/nextpnr-himbaechel-spartan6
          cd "$RUNNER_TEMP/base" && node scripts/resolved-package.mjs packages/silinx-fpga @silinx/nextpnr-himbaechel-spartan3e @silinx/nextpnr-himbaechel-spartan6 $BASE_INSTALL
      # out/<side>/r<run>/<board>/<example>.json; a pair of runs started within the job's first 35 minutes only
      - name: The examples, both sides alternately
        env:
          BOARD: ${{ matrix.board }}
          SHARD: ${{ matrix.shard }}
        run: |
          for run in 1 2 3; do
            if (( run > 1 && SECONDS > 2100 )); then echo "::notice::$BOARD $SHARD/2: $((run - 1)) run(s) of each side (the job's time)"; break; fi
            if (( run % 2 )); then order="base head"; else order="head base"; fi
            for side in $order; do
              dir="$GITHUB_WORKSPACE"; [ "$side" = base ] && dir="$RUNNER_TEMP/base"
              (cd "$dir" && node scripts/nextpnr-update-report.mjs measure "$BOARD" "$GITHUB_WORKSPACE/out/$side/r$run" --shard "$SHARD/2")
            done
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextpnr-measure-${{ matrix.board }}-${{ matrix.shard }}
          path: out
  report:
    needs: [check, measure]
    if: always() && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # the base's code for every step of this job, whose token writes (#1440, #2644)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
      - name: The table of the differences
        env:
          SUMMARY: ${{ needs.check.outputs.summary }}
          BOARDS: ${{ needs.check.outputs.boards }}
        run: |
          mkdir -p results/base results/head
          for d in results/nextpnr-measure-*/; do for side in base head; do [ ! -d "$d$side" ] || cp -r "$d$side/." "results/$side/"; done; done
          node base/scripts/nextpnr-update-report.mjs report --base results/base --head results/head --summary "$SUMMARY" --boards "$BOARDS" --out nextpnr-update.md
          cat nextpnr-update.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextpnr-update-report
          path: |
            nextpnr-update.md
            results
      - name: The pull request's comment
        continue-on-error: true
        run: node base/scripts/nextpnr-update-report.mjs comment nextpnr-update.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
