# Publishes a GitHub Release when a version tag (v1.2.3) is pushed:
#   Silinx-ISE.html                         single-file edition (no install, runs in the browser)
#   silinx-ise-<version>.zip                full app (server + UI + examples), production node_modules included
#   silinx-ise-docker-kit-<version>.zip builder kit for the private Xilinx ISE 14.7 Docker image
#   SHA256SUMS                              the files' SHA-256 checksums (also in the notes), each file with
#                                           GitHub's build provenance attestation (#485)
# The tests are not run here (#416): CI runs at a release only (#607), started by the same tag, and the
# job waits for that run (scripts/wait-for-ci.mjs), then checks the packages it publishes. The tagged
# commit must be on main. The build job (the repository's code and its dependencies) reads only; the
# attestation and the release are made in a job of their own, from its artifact, with no code of the
# repository run there (#2644).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  actions: read               # the tagged commit's CI run
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup
      # CI on this commit, started by the same tag and waited for (the unit tests on Windows take about
      # 45 minutes, a queue more); a failed run, or none: no release
      - name: CI passed
        run: node scripts/wait-for-ci.mjs "$GITHUB_SHA" --timeout 150 --appear 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the single-file edition
        run: node scripts/build-standalone.mjs
      # the same script as the release test (npm run test:release, in CI): the app zip (tracked files +
      # production dependencies), the Docker builder kit for ISE 14.7 (no Xilinx software or licence
      # inside) and the single-file edition
      - name: Package
        run: node scripts/package-release.mjs "${GITHUB_REF_NAME#v}" --out out && ls -la out
      - name: Check the app zip (unzipped, started, open synthesis in Chrome, offline)
        run: npm run test:release
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # "What's new" (CHANGELOG.md section of this version) + downloads / licence note + the checksums
      - name: Notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" --require --sums out/SHA256SUMS > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out
            notes.md
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write     # the files' build provenance (#485)
      contents: write
      id-token: write         # (the attestation's signing certificate, from GitHub's OIDC token)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # signed statements that each file listed in SHA256SUMS was built here, by this workflow, from this
      # tag (gh attestation verify <file> --repo pmnmalo/Silinx-ISE)
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" out/* --title "Silinx ISE $V" --notes-file notes.md
