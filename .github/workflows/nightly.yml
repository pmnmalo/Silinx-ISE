name: Nightly
# The long differential tests (test/corpus/README.md), every night and on demand:
#   - Yosys's own test designs (fetched at the pinned Yosys version, never committed) through Silinx's
#     front end, simulator and open synthesis, against test/corpus/expected.json (fails on regressions)
#   - a new batch of VlogHammer-style random modules (a different seed every run: the run number),
#     Silinx's simulator against Yosys's netlist; a failing module is reduced and printed
on:
  schedule:
    - cron: '17 21 * * *'     # 21:17 UTC: GitHub starts scheduled runs hours late (03:17 started at 08:00-10:40)
  workflow_dispatch:
    inputs:
      count:
        description: VlogHammer modules
        default: '500'
permissions:
  contents: read
jobs:
  # whether main changed since this workflow's last successful run (a scheduled run with nothing new to
  # test is skipped; by hand it always runs): .github/workflows/scheduled-changes.yml, on GitHub's runner
  changes:
    uses: ./.github/workflows/scheduled-changes.yml
    permissions:
      actions: read
      contents: read
    with:
      workflow: nightly.yml
  # in two jobs at once (#343): every other file each (--shard), about half an hour each in October 2026, the
  # open synthesis making several mappings of a module (up to 7 Yosys runs); a file that takes over 15 minutes
  # fails its job (run-corpus.mjs's --timeout); the slowest files are printed at the end
  corpus:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: corpus (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/yosys-tests
          key: yosys-tests-${{ hashFiles('scripts/fetch-yosys-tests.mjs') }}
      - run: npm run fetch:yosys-tests
      - name: Yosys's test designs (Silinx vs Yosys)
        run: npm run test:corpus -- --jobs 4 --shard "$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}
  vloghammer:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: VlogHammer random modules (seed = run number)
        run: npm run test:vloghammer -- --seed $(( RUN_NUMBER * 1000 )) --count "$COUNT" --out vloghammer-failures
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COUNT: ${{ github.event.inputs.count || '500' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vloghammer-failures
          path: vloghammer-failures
  designs:
    # open-source designs (CPUs, peripherals, crypto, benchmarks; test/designs-corpus/manifest.json,
    # fetched at pinned commits, never committed) through the whole toolchain: front end, their own
    # testbenches, open synthesis, netlist vs RTL, the fully open flow to a bitstream; every stage's
    # status and every warning checked against test/designs-corpus/expected.json, and the circuits'
    # size and speed (fails when a design gets larger or slower beyond the noise); the run times
    # against the 'ci' baseline of test/designs-corpus/times.json (CI=true; warnings only; record
    # it from the results artifact: run.mjs --record-times designs-results/results.json --machine ci)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/designs-corpus
          key: designs-corpus-${{ hashFiles('test/designs-corpus/manifest.json') }}
      - run: npm run fetch:designs
      - name: Open designs through the whole toolchain
        run: npm run test:designs -- --jobs 4
      # the corpus's board designs (Basys2-250: corpus-int2float, -prbs, -spi, -serv): their testbench
      # in Silinx's simulator and the fully open flow (pack, place, route, timing) to a bitstream;
      # fails when one does not build (run even when the step above failed)
      - name: Board designs of the corpus
        if: success() || failure()
        run: node test/designs-corpus/boards.mjs .cache/designs-boards .cache/designs-boards/bits
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: designs-results
          path: |
            .cache/designs-results/results.json
            .cache/designs-boards/bits
          if-no-files-found: ignore

  # a failed job is an issue (#251): .github/workflows/failure-report.yml
  report:
    needs: [changes, corpus, vloghammer, designs]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    uses: ./.github/workflows/failure-report.yml
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
