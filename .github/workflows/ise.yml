name: ISE
# The tests against Xilinx ISE 14.7 (test/ise/*.test.js: the examples built by ISE on every device of
# the Silinx toolchain with the expected warnings, Silinx's bitstreams byte-identical to ISE's and
# ISE's DRC clean, the whole ISE flow through the REST API), on a self-hosted runner: a machine with
# the ISE Docker image (xilinx/ise:14.7), registered to this repository with the label "ise".
#
# The repository is public: this workflow runs only code already on main (nightly, and by hand:
# Actions ▸ ISE ▸ Run workflow), never a pull request's, and no other workflow may target the "ise"
# label. The machine's name and address are not written anywhere: the runner reaches GitHub, not
# the other way round.
on:
  schedule:
    - cron: '47 21 * * *'     # after the nightly (21:17 UTC)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ise
  cancel-in-progress: false
jobs:
  # whether main changed since this workflow's last successful run (a scheduled run with nothing new to
  # test is skipped; by hand it always runs): scripts/changed-since-last-run.mjs, here on GitHub's runner
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        run: node scripts/changed-since-last-run.mjs ise.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
  ise:
    # never from a fork, and only main
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.repository == 'pmnmalo/Silinx-ISE' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ise]
    timeout-minutes: 600
    env:
      SILINX_ISE_TESTS: '1'
      SILINX_ISE_HOST: local    # the ISE Docker image on the runner itself
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Docker and the ISE image
        run: docker image inspect --format '{{.Id}} {{.Size}}' "${SILINX_ISE_IMAGE:-xilinx/ise:14.7}"
      - name: ISE tests
        run: node --test --test-reporter=spec test/ise/*.test.js

  # a failed job is an issue (#251): one per job ('<workflow> failed: <job>'), commented on when it is
  # open already; the lines of its log that say what failed, without home folders, logins or addresses
  report:
    needs: [changes, ise]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/report-failure.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
