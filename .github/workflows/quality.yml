name: Quality
# The quality of what the Silinx toolchain generates against Xilinx ISE (XST + map + par), on the
# design corpus (test/designs-corpus: 38 open-source designs, EPFL and VTR benchmarks among them):
# size and speed of each design with both flows on the XC3S1200E (test/designs-corpus/compare-ise.mjs).
# Weekly, and by hand (Actions ▸ Quality ▸ Run workflow), on the self-hosted runner with the ISE
# Docker image (label "ise", as .github/workflows/ise.yml); the new results
# (test/designs-corpus/ise-comparison.json and the page docs/QUALITY.md) are pushed to the branch quality-results, merged into main by a maintainer (main requires CI).
#
# The repository is public: only code already on main runs there, never a pull request's. The job on the
# self-hosted runner has a read-only token and keeps no credentials (it runs third-party code: the corpus's
# fetch, npm ci); the results' commit is pushed from GitHub's runner by a job of its own (#412).
on:
  schedule:
    - cron: '0 23 * * 6'      # Saturdays 23:00 UTC (after the nightly ISE tests)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ise                  # one ISE job at a time on the runner
  cancel-in-progress: false
jobs:
  # whether main changed since this workflow's last successful run (a scheduled run with nothing new to
  # test is skipped; by hand it always runs): .github/workflows/scheduled-changes.yml, on GitHub's runner
  changes:
    uses: ./.github/workflows/scheduled-changes.yml
    permissions:
      actions: read
      contents: read
    with:
      workflow: quality.yml
  compare:
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository_id == '1407836659' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ise]
    # the comparison took 14h13m on 2026-10-25 and passed 15 hours on 2026-10-31 (#2498); with the three Optimizations
    # (#2941) and nextpnr, about 40 hours (#3292: Area alone 10.5 h, the projects 7 h). So no build starts after
    # DEADLINE_MINUTES (a build started then ends, at its BUILD_TIMEOUT_MINUTES, before the job's timeout; the longest
    # measured, 1.4 h), each build is kept on the runner as soon as it
    # is measured (compare-ise.mjs --cache), the partial results are published, and the next run resumes the comparison
    # (the same commit, what is kept taken again). The runner's window does not close while a job runs
    # (scripts/ise-runner/window.mjs).
    # A whole comparison takes about 60 hours (#3297: 7 h of projects, then 402 builds; the runs of 2026-11-11 measured 206
    # of them in 29 h), more than a job's 20: the job runs in PARTS, one after another (max-parallel 1), each to its own
    # deadline, each resuming what the parts before it left (the projects' and the builds' marks, #3292, #3342). The first
    # part of a run's attempt picks the commit to compare and writes it to ~/silinx-cache/quality/runs/<run>-<attempt>;
    # the parts after it compare that commit, and skip once it is whole (no pending mark). A part with nothing left takes a
    # minute; the last part that compared uploads the results (overwrite), which the publish job pushes.
    strategy:
      max-parallel: 1
      fail-fast: true           # (a failed guard: nothing to publish, the parts after it cancelled)
      matrix:
        part: [1, 2, 3, 4, 5]
    timeout-minutes: 1200
    permissions:
      contents: read
    env:
      SILINX_ISE_HOST: local    # ISE from the Docker image on the runner itself
      # the dependencies' install scripts do not run on this machine (npm ci --ignore-scripts, #479)
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      # (#3292: no build starts after DEADLINE_MINUTES from the job's start; a build stops after BUILD_TIMEOUT_MINUTES)
      DEADLINE_MINUTES: 1050
      BUILD_TIMEOUT_MINUTES: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the commit to compare: a comparison left partial (~/silinx-cache/quality/builds/pending, the builds kept between
      # runs by compare-ise.mjs --cache; of the last 14 days) is resumed when it is a commit of main's, one before the
      # checkout (main's history fetched without credentials, git's own check), else main's (#3292); a later part of the
      # same run compares its first part's commit, or skips when that comparison is whole (#3297)
      - name: What to compare
        id: what
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          P="$HOME/silinx-cache/quality/builds/pending" R="$HOME/silinx-cache/quality/runs"
          mkdir -p "$R" && find "$R" -type f -mtime +40 -delete
          R="$R/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" c="" later="" by="an earlier run"
          if [ -f "$R" ]; then
            c=$(head -c 40 "$R" | tr -cd 0-9a-f) later=1 by="the part before"
            if [ ! -f "$P" ] || [ "$(head -c 40 "$P" | tr -cd 0-9a-f)" != "$c" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Part $PART: the comparison of $c is whole (an earlier part of this run), nothing left"
              exit 0
            fi
          elif [ -f "$P" ] && [ -n "$(find "$P" -mtime -14)" ]; then
            c=$(head -c 40 "$P" | tr -cd 0-9a-f)
          fi
          if [ -n "$c" ] && [ "$c" != "$(git rev-parse HEAD)" ]; then
            git fetch -q --no-tags --shallow-since="$(date -v-15d +%Y-%m-%d 2>/dev/null || date -d '15 days ago' +%Y-%m-%d)" origin "$GITHUB_SHA" || true
            if [ ${#c} -eq 40 ] && git merge-base --is-ancestor "$c" HEAD 2>/dev/null; then
              git checkout -q --detach "$c"
              echo "::notice::Part $PART: resuming the comparison of $c (left partial by $by)"
            elif [ -n "$later" ]; then
              echo "::error::Part $PART: $c, the commit of this run's first part, is not one of main's"; exit 1
            fi
          fi
          [ -f "$R" ] || git rev-parse HEAD > "$R"
          git log -1 --format='comparing %H (%cs)'
        env:
          PART: ${{ matrix.part }}
      - if: steps.what.outputs.skip != 'true'
        uses: ./.github/actions/setup
        with:
          npm-cache: false
      # the corpus's sources kept on the runner between runs (the checkout cleans the work folder)
      - name: The corpus's sources
        if: steps.what.outputs.skip != 'true'
        run: |
          mkdir -p "$HOME/silinx-cache/designs-corpus" .cache
          ln -sfn "$HOME/silinx-cache/designs-corpus" .cache/designs-corpus
          npm run fetch:designs
      # the projects of the commit compared, kept for a run that resumes it, design by design (they take hours: #3292, #3342)
      - name: A Silinx project per design
        if: steps.what.outputs.skip != 'true'
        run: |
          C="$HOME/silinx-cache/quality/projects" P="$HOME/silinx-cache/quality/projects/$(git rev-parse HEAD)"
          mkdir -p "$C"
          find "$C" -mindepth 1 -maxdepth 1 ! -path "$P" -exec rm -rf {} +
          [ -f "$P/.done" ] && rm -f "$P/.done"   # (a whole step's mark before #3342)
          if [ -f "$P/.done/.all" ]; then echo "the projects of an earlier run of this commit"; else
            # (the nightly checks the corpus's expectations: here only the projects are needed; --resume: the designs an
            # earlier run of this commit processed kept, each marked as it is done, #3342)
            node test/designs-corpus/run.mjs --stages frontend,synth,flow --sizes "$P" --sizes-only --resume --jobs 1 || true
            mkdir -p "$P/.done" && touch "$P/.done/.all"
          fi
          ls "$P" | wc -l
          echo "QUALITY_PROJECTS=$P" >> "$GITHUB_ENV"
      - name: Silinx toolchain vs ISE
        if: steps.what.outputs.skip != 'true'
        # one build at a time, design after design, Silinx's then ISE's (8 GB of memory: a large design needs some GB on
        # each side); --guard: nothing published when a design built before fails now; --cache, --deadline,
        # --build-timeout: the builds kept as they finish, none started after the deadline, none longer than its limit
        env:
          START: ${{ steps.what.outputs.start }}
        run: |
          node test/designs-corpus/compare-ise.mjs "$QUALITY_PROJECTS" --jobs 1 --ise-jobs 1 --serial --guard \
            --cache "$HOME/silinx-cache/quality/builds" --deadline $((START + DEADLINE_MINUTES * 60)) --build-timeout "$BUILD_TIMEOUT_MINUTES"
      # (each part that compared replaces the artifact: the publish job takes the last one's, #3297)
      - if: always() && steps.what.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-results
          overwrite: true
          path: |
            test/designs-corpus/ise-comparison.json
            docs/QUALITY.md

  # the results' commit, on GitHub's runner (the only job with a writing token, #412 / #486), from the compare
  # job's artifact (its last part's), on the commit it compared; only when the comparison passed (--guard). GITHUB_TOKEN cannot
  # be scoped to one branch: this job runs no code of the artifact and pushes to quality-results only, which a
  # maintainer reviews before merging it into main.
  publish:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-results
          path: ${{ runner.temp }}/quality-results
      # the artifact comes from the maintainer's machine: only its two files are taken, as data (never run),
      # regular files of a sane size, the comparison valid JSON (#486)
      - name: Check the results
        run: |
          R="$RUNNER_TEMP/quality-results"
          for f in test/designs-corpus/ise-comparison.json docs/QUALITY.md; do
            if [ -L "$R/$f" ] || [ ! -f "$R/$f" ]; then echo "::error::$f: not a regular file"; exit 1; fi
            if [ "$(wc -c < "$R/$f")" -gt 2000000 ]; then echo "::error::$f: larger than 2 MB"; exit 1; fi
          done
          jq -e '.designs | type == "array"' "$R/test/designs-corpus/ise-comparison.json" > /dev/null
      - name: Commit the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/quality-results/test/designs-corpus/ise-comparison.json" test/designs-corpus/
          cp "$RUNNER_TEMP/quality-results/docs/QUALITY.md" docs/
          git add test/designs-corpus/ise-comparison.json docs/QUALITY.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # (a partial comparison says so, #3292: the next run makes the builds it left)
          n=$(jq '.missing // [] | length' test/designs-corpus/ise-comparison.json)
          part=""; [ "$n" -gt 0 ] && part=", partial: $n builds left for the next run"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Quality: the weekly Silinx toolchain vs ISE comparison (docs/QUALITY.md$part)"
          # main requires CI's checks (a ruleset), which a workflow's push cannot pass: the results go to the
          # branch quality-results, to be merged into main by a maintainer (CLAUDE.md, Integration)
          # the token as git's authorization header for github.com (as actions/checkout sets it), for this step's pushes only
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"; export GIT_CONFIG_VALUE_0
          git push -q -f origin HEAD:refs/heads/quality-results
          echo "::notice::Results pushed to the branch quality-results: merge it into main"

  # a failed job is an issue (#251): .github/workflows/failure-report.yml
  report:
    needs: [changes, compare, publish]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    uses: ./.github/workflows/failure-report.yml
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
