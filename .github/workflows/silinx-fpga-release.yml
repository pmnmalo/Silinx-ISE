# Publishes the toolchain's package, silinx-fpga (packages/silinx-fpga), on npm when its own version tag
# (silinx-fpga-v0.1.0) is pushed (#1681), with npm's provenance: a signed statement that the package was built here,
# by this workflow, from this tag (npm audit signatures, or the package's page on npmjs.com). As the IDE's Release:
# the tests are not run here; CI, started by the same tag, runs them all (the package's among them) and the job
# waits for that run (scripts/wait-for-ci.mjs). The tagged commit must be on main, its package's version the tag's,
# with its changelog section and no fragment left (scripts/sync-version.mjs --package). No token: npm's trusted
# publishing (#2428) authenticates this workflow by GitHub's OIDC token, the package's trusted publisher on npmjs.com
# being this repository and this workflow; it needs npm 11.5.1 or later (Node 22's is npm 10), pinned here by its
# tarball's integrity (#3049). No
# GitHub Release: the Pages site serves the IDE's latest one. The OIDC token is the publish job's only (#2644): the
# build job, which installs the dependencies and runs the repository's code, packs the package and holds none; the
# publish job runs only npm, on that tarball.
name: silinx-fpga release
on:
  push:
    tags: ['silinx-fpga-v*']
permissions:
  actions: read               # the tagged commit's CI run
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup
      - name: The tag's version, with its changelog
        run: |
          V="${GITHUB_REF_NAME#silinx-fpga-v}"
          test "$(node -p "require('./packages/silinx-fpga/package.json').version")" = "$V" || { echo "packages/silinx-fpga/package.json is not $V"; exit 1; }
          node scripts/sync-version.mjs --package silinx-fpga
      # CI on this commit, started by the same tag and waited for; a failed run, or none: no release
      - name: CI passed
        run: node scripts/wait-for-ci.mjs "$GITHUB_SHA" --timeout 150 --appear 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack
        run: mkdir -p out && npm pack -w silinx-fpga --ignore-scripts --pack-destination out && ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silinx-fpga
          path: out
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write         # npm's trusted publishing and provenance (GitHub's OIDC token)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: silinx-fpga
          path: out
      # npm 11.21.0 (its dependencies bundled in its tarball): the tarball checked against the integrity pinned here
      # (npm view npm@11.21.0 dist.integrity), then installed from that file, before the job's token publishes (#3049)
      - name: Publish
        env:
          NPM_TARBALL: https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          curl -fsSL -o "$RUNNER_TEMP/npm.tgz" "$NPM_TARBALL"
          test "sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm.tgz" | base64 -w0)" = "$NPM_INTEGRITY" || { echo "::error::$NPM_TARBALL is not the tarball of its pinned integrity"; exit 1; }
          npm install --global "$RUNNER_TEMP/npm.tgz" --ignore-scripts --no-audit --no-fund
          npm publish ./out/silinx-fpga-*.tgz --provenance --access public --ignore-scripts
