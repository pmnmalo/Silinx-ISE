name: Development build
# A pre-release "Development build" (tag dev) with the files of main as a release has them (the app zip,
# the Docker builder kit, Silinx.html), updated in place after every push to main (no tests: CI runs at
# a release only, #607; the build itself must work):
#   https://github.com/pmnmalo/Silinx-ISE/releases/tag/dev
# One pre-release, moved and its files replaced (no new release, no notification each time); a
# pre-release is never "Latest", so Check for Updates and the stable site keep to the releases.
# Its browser edition is also on the site: https://pmnmalo.github.io/Silinx-ISE/dev/ (pages.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # the Development menu reads its changes' issue labels (#707)
  issues: read
concurrency:
  group: dev-release
  cancel-in-progress: true
jobs:
  # the repository's code and its dependencies run here, with a token that only reads (#2644)
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the single-file edition
        # (the token only reads the issues' labels of the Development menu, #707: it is not written anywhere)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-standalone.mjs
      - name: Package (as a release, version dev)
        run: node scripts/package-release.mjs dev --out out && ls -la out
      # the changes not released yet (the changelog fragments, changes/*.md, and CHANGELOG.md's newest section when it is not a release)
      - name: Notes
        run: node scripts/dev-notes.mjs > out/notes.md && cat out/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-release
          path: out
          retention-days: 1
  # the writing token on this job only, which runs no code of the repository or of its dependencies:
  # the tag dev moved to this commit, the pre-release's files replaced (#2644)
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-release
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv out/notes.md notes.md
          if gh api "repos/$GH_REPO/git/refs/tags/dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --title "Development build" --notes-file notes.md
            gh release upload dev out/* --clobber
          else
            gh release create dev out/* --prerelease --title "Development build" --notes-file notes.md
          fi
