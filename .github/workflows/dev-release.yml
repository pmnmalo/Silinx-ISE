name: Development build
# A pre-release "Development build" (tag dev) with the files of main as a release has them (the app zip,
# the Docker builder kit, Silinx-ISE.html), updated in place after every push to main (no tests: CI runs at
# a release only, #607; the build itself must work):
#   https://github.com/pmnmalo/Silinx-ISE/releases/tag/dev
# One pre-release, moved and its files replaced (no new release, no notification each time); a
# pre-release is never "Latest", so Check for Updates and the stable site keep to the releases.
# Its browser edition is also on the site: https://pmnmalo.github.io/Silinx-ISE/dev/ (pages.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-release
  cancel-in-progress: true
jobs:
  dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Build the single-file edition
        run: node scripts/build-standalone.mjs
      - name: Package (as a release, version dev)
        run: node scripts/package-release.mjs dev --out out && ls -la out
      # the changes not released yet (the changelog fragments, changes/*.md, and CHANGELOG.md's newest section when it is not a release)
      - name: Notes
        run: node scripts/dev-notes.mjs > out-notes.md && cat out-notes.md
      # the tag dev moved to this commit, the pre-release's files replaced
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev HEAD
          git push -f origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --title "Development build" --notes-file out-notes.md
            gh release upload dev out/* --clobber
          else
            gh release create dev out/* --prerelease --title "Development build" --notes-file out-notes.md
          fi
