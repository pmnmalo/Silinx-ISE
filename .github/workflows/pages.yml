name: Pages
# The single-file edition (Silinx-ISE.html: no install, runs in the browser) published on GitHub
# Pages, so that a course page (e.g. Moodle, as a URL resource) can link to it:
#   https://pmnmalo.github.io/Silinx-ISE/       the stable edition: the latest release
#   https://pmnmalo.github.io/Silinx-ISE/dev/   the development edition: main, after every push
#                                               (its title says "dev:<commit> (<date>)";
#                                               its browser storage is its own)
# Built after every push to main (the dev edition: that commit; no tests, CI runs at a release only,
# #607), after every release (the stable edition: its tag), and on demand (Actions ▸ Pages ▸ Run
# workflow). A release that failed publishes nothing: the site keeps what it had.
# (The github-pages environment deploys from main only: both editions are built in a run on main.)
# (Uploading the HTML file to Moodle itself does not work: Moodle's filtering of uploaded HTML files
# removes its <script> tags and shows the code as text.)
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # after a push to main; after a release: when it was published
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # the commit pushed; after a release or on demand, main's latest commit
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # the stable edition: the latest release's tag, built from its own checkout (its own scripts and
      # dependencies), at the root of the site
      - name: The latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Stable edition: $TAG ($(git rev-parse --short "$TAG^{commit}"))"
      - name: Build the stable edition (the site's root)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git worktree add --detach ../stable "$TAG"
          cd ../stable
          npm ci
          node scripts/build-standalone.mjs --site "$GITHUB_WORKSPACE/site"
      # the development edition: this commit of main, in dev/ (after the stable one: the root's build
      # empties the site folder first)
      - name: Build the development edition (dev/)
        run: |
          git log -1 --format='Development edition: %h %s (%ci)'
          npm ci
          node scripts/build-standalone.mjs --site site/dev
      # the older releases' assets (#487): a Silinx-ISE.html downloaded from the site fetches its own
      # version's assets (assets/<version>/, Yosys in assets/vendor/yowasp-yosys/<its version>/): the
      # site keeps those of its last releases, each built from its tag (its own script, with
      # --assets-only); and the unversioned assets/ of the files downloaded before versioned assets
      # (v15.11.1 and earlier), once the stable edition no longer writes them itself
      - name: The older releases' assets
        env:
          STABLE: ${{ steps.release.outputs.tag }}
          KEEP: 5
          LEGACY: v15.11.1
        run: |
          versioned() { git show "$1:scripts/build-standalone.mjs" | grep -q -- '--assets-only'; }
          kept=0
          for TAG in $(git tag --list 'v[0-9]*' --sort=-v:refname); do
            [ "$kept" -ge "$KEEP" ] && break
            [ "$TAG" = "$STABLE" ] && continue
            versioned "$TAG" || continue
            git worktree add --detach "../assets-$TAG" "$TAG"
            (cd "../assets-$TAG" && npm ci && node scripts/build-standalone.mjs --assets-only "$GITHUB_WORKSPACE/site/assets")
            kept=$((kept + 1))
          done
          if versioned "$STABLE"; then
            git worktree add --detach ../legacy "$LEGACY"
            (cd ../legacy && npm ci && node scripts/build-standalone.mjs --site "$RUNNER_TEMP/legacy-site")
            cp -R "$RUNNER_TEMP/legacy-site/assets/." site/assets/
          fi
          du -sh site site/assets
      # the usage counts of the site (GoatCounter: no cookies, no personal data), when the repository
      # variable GOATCOUNTER_CODE is set (Settings ▸ Secrets and variables ▸ Actions ▸ Variables);
      # only the pages opened on the site, never the file people download
      - name: Usage counts (GoatCounter)
        if: vars.GOATCOUNTER_CODE != ''
        run: node scripts/site-analytics.mjs site "$GOATCOUNTER_CODE"
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
