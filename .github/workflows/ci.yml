name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: UI tests (headless Chrome)
        run: npm run test:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/build-standalone.mjs
