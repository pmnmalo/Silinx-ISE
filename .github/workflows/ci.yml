name: CI
# The tests, all of them, at a release only (#607): when a version tag v* is pushed (the Release workflow
# waits for this run of the tagged commit, scripts/wait-for-ci.mjs), and by hand (Actions ▸ CI ▸ Run
# workflow, on main or a branch). Not on pull requests nor on pushes to main: a change is merged after
# the tests related to it, run locally (CLAUDE.md); the scheduled workflows (nightly, ISE, Quality) keep
# watching between releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
# Everything runs: the unit tests on Linux, macOS and Windows, the UI tests in both interfaces, Firefox /
# WebKit, the operating systems' smoke tests, WebKit memory and the standalone build, the release zip, the
# history's private-data scan. ci-ok is green when every job passed.
jobs:
  # the unit tests, in three parts at once of about the same time (scripts/test-shard.mjs, by each file's
  # time in test/timings.json, #573), on Linux, macOS and Windows: about
  # 105 minutes one after another on Linux, a part about 17 (its files two at a time or so). A part takes
  # as long as its longest file at least (sim-model.test.js, about 16 minutes, #575): four parts were no
  # faster. The Linux parts upload each file's time, to refresh the timings now and then:
  # node scripts/update-test-timings.mjs <run id>. The end of the output lists each file's time, and a file
  # over 15 minutes is a warning (scripts/test-file-times.mjs, #566)
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: unit (${{ matrix.os }}, ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: >-
          node scripts/test-shard.mjs "$SHARD/3"
          --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/test-file-times.mjs --test-reporter-destination=stdout
          --test-reporter=./scripts/test-times-reporter.mjs --test-reporter-destination=test-times.json
        shell: bash   # (Windows: PowerShell would not expand $SHARD)
        env:
          SHARD: ${{ matrix.shard }}
      - if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-times-${{ matrix.shard }}
          path: test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # the UI tests in headless Chrome, with each interface (alongside the unit tests), in three parts of about
  # the same time, one file at a time (scripts/test-shard.mjs --ui, by test/timings.json's test/ui/ files,
  # #912): about 30 minutes of files in October 2026, a part about 10 (its longest file, open-toolchain, 7).
  # Each part uploads its files' times, merged by node scripts/update-test-timings.mjs <run id>
  ui:
    strategy:
      fail-fast: false
      matrix:
        interface: [modern, classic]
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ui (${{ matrix.interface }}, ${{ matrix.part }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: UI tests (headless Chrome, ${{ matrix.interface }} interface, part ${{ matrix.part }}/3)
        run: >-
          node scripts/test-shard.mjs "$PART/3" --ui --test-concurrency=1
          --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/test-file-times.mjs --test-reporter-destination=stdout
          --test-reporter=./scripts/test-times-reporter.mjs --test-reporter-destination=test-times.json
        timeout-minutes: 25
        env:
          PART: ${{ matrix.part }}
          CHROME_PATH: /usr/bin/google-chrome
          SILINX_UI_INTERFACE: ${{ matrix.interface == 'classic' && 'classic' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-times-${{ matrix.interface }}-${{ matrix.part }}
          path: test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # the memory test in WebKit (Safari's engine), and the single-file edition builds
  webkit-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # the browsers kept between runs, for the version of Playwright (#415); the system's libraries
      # installed every run (--with-deps)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Memory in WebKit (Safari's engine)
        run: npx playwright install --with-deps webkit && npm run test:webkit
        timeout-minutes: 15
      - run: node scripts/build-standalone.mjs

  # the release zip as users get it: packaged as the Release workflow does, unzipped, started with its
  # launcher, and the open synthesis run in Chrome from it without the Internet
  release-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:release
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # the main UI flows in Firefox and in WebKit (Safari's engine)
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:browsers
        timeout-minutes: 20

  # macOS and Windows: a small UI smoke test in the installed Chrome (and on macOS the release zip,
  # with its .command launcher); their unit tests are in the unit job
  os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the macOS runner's Chrome with its GPU slows down until it stops answering: software rendering
      SILINX_UI_CHROME_ARGS: ${{ matrix.os == 'macos-latest' && '--disable-gpu' || '' }}
      SILINX_UI_CDP_TIMEOUT: 60000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: UI smoke test (headless Chrome)
        run: node --test --test-concurrency=1 test/ui/modern.test.js test/ui/focus.test.js test/ui/synth-open.test.js
        timeout-minutes: 10
      - name: Release zip
        if: runner.os == 'macOS'
        run: npm run test:release
        timeout-minutes: 10

  # the private-data scan of the whole history (#498): every line ever added and every commit message
  # of HEAD's history (about 3 s; the tracked files are scanned on every run, by test/private-data.test.js
  # in the unit job). HEAD's history only, not every branch (#555): the tagged commit's, main's history
  # up to it; an open branch never fails a release.
  # Only node's built-ins: no npm ci.
  private-data-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-private-data.mjs --history

  # the verdict of the run (#409), which the Release workflow waits for: green when every job above passed,
  # red when one failed or was cancelled
  ci-ok:
    if: always()
    needs: [unit, ui, webkit-standalone, release-zip, browsers, os, private-data-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs) }}
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
