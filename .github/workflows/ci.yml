name: CI
# on every push to main and every pull request, the documentation's too (#409): the one check that main
# requires, ci-ok, is always reported; a change of documentation only (scripts/ci-changes.mjs) runs the
# unit tests alone (the documentation's tests among them), not the long jobs
on:
  push:
    branches: [main]
  pull_request:
# a newer push to a pull request cancels its run still going; on main every push's run completes (the
# development site is deployed from a green run of main: cancelled runs, merges in quick succession,
# would leave it behind)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# A pull request runs the unit tests on Linux and the UI tests of the modern interface; the classic
# interface's and Firefox / WebKit only when it changes the interface (#573); a push to main runs everything: the unit tests on macOS and Windows too, the operating systems' smoke
# tests, WebKit memory and the standalone build, the release zip. A failure there only (an OS-specific
# bug) becomes an issue, fixed in the next change. main requires one check to merge (a ruleset): ci-ok,
# green when every job passed or was skipped.
jobs:
  # whether more than the documentation changed (scripts/ci-changes.mjs): a pull request's merge commit
  # against its base, a push against the commit main had before it
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        run: node scripts/ci-changes.mjs "$BASE" HEAD
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}

  # the unit tests, in three parts at once of about the same time (scripts/test-shard.mjs, by each file's
  # time in test/timings.json, #573), on Linux, macOS and Windows (Linux only for a pull request): about
  # 105 minutes one after another on Linux, a part about 17 (its files two at a time or so). A part takes
  # as long as its longest file at least (sim-model.test.js, about 16 minutes, #575): four parts were no
  # faster. The Linux parts upload each file's time, to refresh the timings now and then:
  # node scripts/update-test-timings.mjs <run id>. The end of the output lists each file's time, and a file
  # over 15 minutes is a warning (scripts/test-file-times.mjs, #566)
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: unit (${{ matrix.os }}, ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: >-
          node scripts/test-shard.mjs "$SHARD/3"
          --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/test-file-times.mjs --test-reporter-destination=stdout
          --test-reporter=./scripts/test-times-reporter.mjs --test-reporter-destination=test-times.json
        shell: bash   # (Windows: PowerShell would not expand $SHARD)
        env:
          SHARD: ${{ matrix.shard }}
      - if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-times-${{ matrix.shard }}
          path: test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # the UI tests in headless Chrome, with each interface (alongside the unit tests); on a pull request the
  # classic interface only when it changes the interface (#573)
  ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        interface: ${{ fromJSON((github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true') && '["modern", "classic"]' || '["modern"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: ui (${{ matrix.interface }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: UI tests (headless Chrome, ${{ matrix.interface }} interface)
        run: npm run test:ui -- --test-concurrency=1
        timeout-minutes: 15
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SILINX_UI_INTERFACE: ${{ matrix.interface == 'classic' && 'classic' || '' }}

  # the memory test in WebKit (Safari's engine), and the single-file edition builds
  webkit-standalone:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # the browsers kept between runs, for the version of Playwright (#415); the system's libraries
      # installed every run (--with-deps)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Memory in WebKit (Safari's engine)
        run: npx playwright install --with-deps webkit && npm run test:webkit
        timeout-minutes: 15
      - run: node scripts/build-standalone.mjs

  # the release zip as users get it: packaged as the Release workflow does, unzipped, started with its
  # launcher, and the open synthesis run in Chrome from it without the Internet
  release-zip:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:release
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # the main UI flows in Firefox and in WebKit (Safari's engine); on a pull request only when it changes
  # the interface (#573)
  browsers:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:browsers
        timeout-minutes: 20

  # macOS and Windows: a small UI smoke test in the installed Chrome (and on macOS the release zip,
  # with its .command launcher); their unit tests are in the unit job
  os:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the macOS runner's Chrome with its GPU slows down until it stops answering: software rendering
      SILINX_UI_CHROME_ARGS: ${{ matrix.os == 'macos-latest' && '--disable-gpu' || '' }}
      SILINX_UI_CDP_TIMEOUT: 60000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: UI smoke test (headless Chrome)
        run: node --test --test-concurrency=1 test/ui/modern.test.js test/ui/focus.test.js test/ui/synth-open.test.js
        timeout-minutes: 10
      - name: Release zip
        if: runner.os == 'macOS'
        run: npm run test:release
        timeout-minutes: 10

  # the private-data scan of the whole history (#498): every line ever added and every commit message
  # of HEAD's history (about 3 s; the tracked files are scanned on every run, by test/private-data.test.js
  # in the unit job). HEAD's history only, not every branch (#555): on a push to main, main's; on a pull
  # request, its merge commit's (main and the pull request's commits), so that a line added and removed
  # again on a branch is found before it reaches main, and an open branch never fails main.
  # Only node's built-ins: no npm ci.
  private-data-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-private-data.mjs --history

  # the dependencies a pull request adds or updates (#498): red when one has a known vulnerability of
  # moderate severity or worse. No licence list here: the licences in use are tracked by
  # scripts/third-party.mjs and THIRD-PARTY-NOTICES.md (CLAUDE.md, Programming). No comment on the pull
  # request (a Dependabot's or a fork's token is read-only): the findings are in the job's summary.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # the one check that main requires (a ruleset, #409): green when every job above passed or was skipped
  # (documentation only, or a pull request's run), red when one failed or was cancelled
  ci-ok:
    if: always()
    needs: [changes, unit, ui, webkit-standalone, release-zip, browsers, os, private-data-history, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs) }}
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
