name: CI
# The tests, all of them, at a release (#607): when a version tag v* is pushed (the Release workflow
# waits for this run of the tagged commit, scripts/wait-for-ci.mjs), or the toolchain package's silinx-fpga-v*
# (its npm publishing waits for it the same way, silinx-fpga-release.yml, #1681), and by hand (Actions ▸ CI ▸ Run
# workflow, on main or a branch). And every night on main, after the Nightly, when main changed since this
# workflow's last successful run on main (#3423, scheduled-changes.yml): the breaks a pull request's related tests
# miss (a UI test that depends on a change indirectly, two pull requests that break together, a test that fails on
# macOS or Windows only) found the next morning, not at the release; a failed job is an issue, as the Nightly's
# (failure-report.yml). A scheduled run publishes nothing, and the Release does not take it for a tag's
# (wait-for-ci.mjs: a push's or a run by hand only). Not on pull requests nor on pushes to main: a change is merged
# after the tests related to it (CLAUDE.md); the other scheduled workflows (nightly, ISE, Quality) keep watching too.
on:
  push:
    tags: ['v*', 'silinx-fpga-v*']
  schedule:
    - cron: '17 23 * * *'     # 23:17 UTC, two hours after the Nightly (21:17), when main changed (#3423)
  workflow_dispatch:
permissions:
  contents: read
# The runs of the tags one at a time (#3124): the IDE's tag and the toolchain package's pushed together shared the 20 jobs
# a public repository runs at once (5 on macOS), their jobs queued up to 50 minutes; the second now waits for the first,
# and its release does not even need it on the same commit (scripts/wait-for-ci.mjs takes any tag's run of the commit).
# GitHub keeps one run waiting per group: a third tag pushed while one runs and one waits cancels the waiting one. Its
# release then fails, unless another tag's run of the same commit passed ("CI did not pass (cancelled)"): run CI on that
# tag again (Actions ▸ CI ▸ the cancelled run ▸ Re-run all jobs) and then its release. Push the tags of a release two at a
# time at most. The scheduled run in a group of its own (#3423): it neither waits for a tag's run nor makes one wait
# (nor cancels it), though both share the jobs GitHub runs at once. A run by hand, on its ref and commit.
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-tags' || github.event_name == 'schedule' && 'ci-schedule' || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: false
# Everything runs: the unit tests on Linux (the toolchain's heaviest on Linux only, #3124), macOS and Windows, the UI
# tests in both interfaces, Firefox /
# WebKit, the operating systems' smoke tests, WebKit memory and the standalone build, the release zip, the
# history's private-data scan. ci-ok is green when every job passed.
jobs:
  # whether main changed since this workflow's last successful run on main (#3423: a scheduled run with nothing new
  # to test is skipped; a tag's run and one by hand always run): .github/workflows/scheduled-changes.yml
  changes:
    uses: ./.github/workflows/scheduled-changes.yml
    permissions:
      actions: read
      contents: read
    with:
      workflow: ci.yml

  # the unit tests, in parts at once of about the same time (scripts/test-shard.mjs, by each file's time in
  # test/timings.json, #573): on Linux all of them in five parts; on macOS and Windows in three, but the toolchain's
  # heaviest tests (HEAVY in scripts/test-shard.mjs, --light: the whole open flow on every feature, device and example,
  # the post-place & route models, the synthesis on the corpus), about half the time, which ran 60 to 80 minutes there
  # (#3124). A part takes as long as its longest file at least (its tests one after another): a file over 15 minutes
  # is split (test/open-flow*.test.js, test/sim-model-par*.test.js, #3124). The Linux parts upload each file's time,
  # to refresh the timings now and then:
  # node scripts/update-test-timings.mjs <run id>. The end of the output lists each file's time, and a file
  # over 15 minutes is a warning (scripts/test-file-times.mjs, #566)
  unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4, 5]
        exclude:
          - { os: macos-latest, shard: 4 }
          - { os: macos-latest, shard: 5 }
          - { os: windows-latest, shard: 4 }
          - { os: windows-latest, shard: 5 }
    runs-on: ${{ matrix.os }}
    # (Windows: a part 33 to over 45 minutes, Linux about 12, #1582; macOS and Windows over 60 by 15.21.0, #2665, 80 by
    # 15.23.0; a part about 40 minutes since #3124, the limit twice that)
    timeout-minutes: 90
    name: unit (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.os == 'ubuntu-latest' && 5 || 3 }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: >-
          node scripts/test-shard.mjs "$SHARD/$PARTS" $LIGHT
          --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/test-file-times.mjs --test-reporter-destination=stdout
          --test-reporter=./scripts/test-times-reporter.mjs --test-reporter-destination=test-times.json
        shell: bash   # (Windows: PowerShell would not expand $SHARD)
        env:
          SHARD: ${{ matrix.shard }}
          PARTS: ${{ matrix.os == 'ubuntu-latest' && 5 || 3 }}
          LIGHT: ${{ matrix.os != 'ubuntu-latest' && '--light' || '' }}
      - if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-times-${{ matrix.shard }}
          path: test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # the UI tests in headless Chrome, with each interface (alongside the unit tests), in three parts of about
  # the same time, one file at a time (scripts/test-shard.mjs --ui, by test/timings.json's test/ui/ files,
  # #912): about 30 minutes of files in October 2026, a part about 10 (its longest file, open-toolchain, 7);
  # about 70 in November 2026, a part up to 25 on a slow runner (#2462).
  # Each part uploads its files' times, merged by node scripts/update-test-timings.mjs <run id>
  ui:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        interface: [silinx, ise]
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: ui (${{ matrix.interface }}, ${{ matrix.part }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: UI tests (headless Chrome, ${{ matrix.interface }} interface, part ${{ matrix.part }}/3)
        run: >-
          node scripts/test-shard.mjs "$PART/3" --ui --test-concurrency=1
          --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/test-file-times.mjs --test-reporter-destination=stdout
          --test-reporter=./scripts/test-times-reporter.mjs --test-reporter-destination=test-times.json
        timeout-minutes: 40
        env:
          PART: ${{ matrix.part }}
          CHROME_PATH: /usr/bin/google-chrome
          SILINX_UI_INTERFACE: ${{ matrix.interface == 'ise' && 'ise' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-times-${{ matrix.interface }}-${{ matrix.part }}
          path: test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # the memory test in WebKit (Safari's engine), and the single-file edition builds
  webkit-standalone:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # (Ubuntu 24.04: Playwright's WebKit is built for its libicu 74, ubuntu-latest's 26.04 has 78, #3854)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # the browsers kept between runs, for the version of Playwright (#415); the system's packages they need
      # installed every run (--with-deps), from apt's downloads kept between runs too, for the runner's image
      # (#2921: a slow mirror took 13 minutes for them, #1559, then 50, at 31 kB/s, the job's time gone)
      - id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-webkit-${{ steps.image.outputs.key }}
          restore-keys: apt-webkit-
      # an install that stalls stopped at 10 minutes and run once more, with what it downloaded
      - name: WebKit and its system packages
        run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\n' ~/apt-archives \
            | sudo tee /etc/apt/apt.conf.d/90silinx-archives > /dev/null
          for attempt in 1 2; do
            if timeout 10m npx playwright install --with-deps webkit; then sudo chown -R "$USER" ~/apt-archives; exit 0; fi
            echo "::warning::WebKit and its system packages: attempt $attempt stopped or failed (#2921)"
            sudo dpkg --configure -a
          done
          exit 1
        timeout-minutes: 25
      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-webkit-${{ steps.image.outputs.key }}
      - name: Memory in WebKit (Safari's engine)
        run: npm run test:webkit
        timeout-minutes: 15
      - run: node scripts/build-standalone.mjs

  # the release zip as users get it: packaged as the Release workflow does, unzipped, started with its
  # launcher, and the open synthesis run in Chrome from it without the Internet
  release-zip:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run test:release
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # the main UI flows in Firefox and in WebKit (Safari's engine)
  browsers:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # (Ubuntu 24.04: Playwright's WebKit is built for its libicu 74, ubuntu-latest's 26.04 has 78, #3854)
    runs-on: ubuntu-24.04
    # (Firefox, then WebKit, one file at a time: about 25 minutes, #1126; the steps' own limits first, #2939)
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # the browsers kept between runs, for the version of Playwright (#415); the system's packages they need
      # installed every run (--with-deps), from apt's downloads kept between runs too, for the runner's image
      # (#2921: a slow mirror took 13 minutes for them, #1559, then 50, at 31 kB/s, the job's time gone)
      - id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-firefox-webkit-${{ steps.image.outputs.key }}
          restore-keys: apt-firefox-webkit-
      # an install that stalls stopped at 10 minutes and run once more, with what it downloaded
      - name: Firefox, WebKit and their system packages
        run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\n' ~/apt-archives \
            | sudo tee /etc/apt/apt.conf.d/90silinx-archives > /dev/null
          for attempt in 1 2; do
            if timeout 10m npx playwright install --with-deps firefox webkit; then sudo chown -R "$USER" ~/apt-archives; exit 0; fi
            echo "::warning::Firefox, WebKit and their system packages: attempt $attempt stopped or failed (#2921)"
            sudo dpkg --configure -a
          done
          exit 1
        timeout-minutes: 25
      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-firefox-webkit-${{ steps.image.outputs.key }}
      - run: npm run test:browsers
        timeout-minutes: 40

  # macOS and Windows: a small UI smoke test in the installed Chrome (and on macOS the release zip,
  # with its .command launcher); their unit tests are in the unit job
  os:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the macOS runner's Chrome with its GPU slows down until it stops answering: software rendering
      SILINX_UI_CHROME_ARGS: ${{ matrix.os == 'macos-latest' && '--disable-gpu' || '' }}
      SILINX_UI_CDP_TIMEOUT: 60000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: UI smoke test (headless Chrome)
        run: node --test --test-concurrency=1 test/ui/silinx.test.js test/ui/focus.test.js test/ui/synth-open.test.js
        timeout-minutes: 10
      - name: Release zip
        if: runner.os == 'macOS'
        run: npm run test:release
        timeout-minutes: 10

  # the private-data scan of the whole history (#498): every line ever added and every commit message
  # of HEAD's history (about 3 s; the tracked files are scanned on every run, by test/private-data.test.js
  # in the unit job). HEAD's history only, not every branch (#555): the tagged commit's, main's history
  # up to it; an open branch never fails a release.
  # Only node's built-ins: no npm ci.
  private-data-history:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-private-data.mjs --history

  # the verdict of the run (#409), which the Release workflow waits for: green when every job above passed,
  # red when one failed, was cancelled or was skipped (a tag's run and one by hand skip nothing: a failed change check
  # never lets a release through untested, #3423); not in a scheduled run, whose failed jobs are reported one by one
  # (its own failure would be one more issue)
  ci-ok:
    if: always() && github.event_name != 'schedule'
    needs: [changes, unit, ui, webkit-standalone, release-zip, browsers, os, private-data-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs) }}
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # a failed job of a scheduled run is an issue, as the Nightly's (#251, #3423): .github/workflows/failure-report.yml
  report:
    needs: [changes, unit, ui, webkit-standalone, release-zip, browsers, os, private-data-history]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    uses: ./.github/workflows/failure-report.yml
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
