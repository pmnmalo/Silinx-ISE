name: CI
# not for a push or pull request that changes only documentation (#149): .github/workflows/docs.yml
# checks those (links, the paths and menus they name, the CHANGELOG, the quality page)
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
# a newer push to a pull request cancels its run still going; on main every push's run completes (the
# development site is deployed from a green run of main: cancelled runs, merges in quick succession,
# would leave it behind)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# A pull request runs the unit tests on Linux, the UI tests in both interfaces and Firefox / WebKit
# (main requires the unit and UI checks to merge it: a ruleset); a push to main runs everything: the
# unit tests on macOS and Windows too, the operating systems' smoke tests, WebKit memory and the
# standalone build, the release zip. A failure there only (an OS-specific bug) becomes an issue,
# fixed in the next change.
jobs:
  # the unit tests, in three parts at once (node --test --test-shard), on Linux, macOS and Windows
  # (Linux only for a pull request): one after another they take about 15 minutes on Linux and 20 on
  # the macOS and Windows runners
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    name: unit (${{ matrix.os }}, ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-shard=${{ matrix.shard }}/3 "test/*.test.js"

  # the UI tests in headless Chrome, with each interface (alongside the unit tests)
  ui:
    strategy:
      fail-fast: false
      matrix:
        interface: [modern, classic]
    runs-on: ubuntu-latest
    name: ui (${{ matrix.interface }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI tests (headless Chrome, ${{ matrix.interface }} interface)
        run: npm run test:ui -- --test-concurrency=1
        timeout-minutes: 15
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SILINX_UI_INTERFACE: ${{ matrix.interface == 'classic' && 'classic' || '' }}

  # the memory test in WebKit (Safari's engine), and the single-file edition builds
  webkit-standalone:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Memory in WebKit (Safari's engine)
        run: npx playwright install --with-deps webkit && npm run test:webkit
        timeout-minutes: 15
      - run: node scripts/build-standalone.mjs

  # the release zip as users get it: packaged as the Release workflow does, unzipped, started with its
  # launcher, and the open synthesis run in Chrome from it without the Internet
  release-zip:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # the main UI flows in Firefox and in WebKit (Safari's engine)
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:browsers
        timeout-minutes: 20

  # macOS and Windows: a small UI smoke test in the installed Chrome (and on macOS the release zip,
  # with its .command launcher); their unit tests are in the unit job
  os:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # the macOS runner's Chrome with its GPU slows down until it stops answering: software rendering
      SILINX_UI_CHROME_ARGS: ${{ matrix.os == 'macos-latest' && '--disable-gpu' || '' }}
      SILINX_UI_CDP_TIMEOUT: 60000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI smoke test (headless Chrome)
        run: node --test --test-concurrency=1 test/ui/modern.test.js test/ui/focus.test.js test/ui/synth-open.test.js
        timeout-minutes: 10
      - name: Release zip
        if: runner.os == 'macOS'
        run: npm run test:release
        timeout-minutes: 10
