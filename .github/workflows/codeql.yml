name: CodeQL
# GitHub's static analysis of the JavaScript (#498): injection, path traversal and the like in server/,
# web/js and core/: nightly on main when its JavaScript changed since the last successful run
# (scheduled-changes.yml; Security ▸ Code scanning tracks the default branch's alerts), at a release (a
# version tag v*, alongside CI) and on demand, which always run; not on pull requests (#607). A workflow of its own, not a job of ci.yml: the Release does not wait for it. Its findings are in Security ▸ Code scanning. The vendored data
# (research/'s corpora and records) and node_modules are left out: no code of ours there.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '41 3 * * *'      # nightly, 03:41 UTC, on main
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # whether main's code changed since this workflow's last successful run (a nightly run with nothing new is
  # skipped; a tag's or one by hand always runs)
  changes:
    uses: ./.github/workflows/scheduled-changes.yml
    permissions:
      actions: read
      contents: read
    with:
      workflow: codeql.yml
      only: core/,server/,web/,scripts/,bin/,test/,.github/workflows/codeql.yml
  analyze:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write    # the findings, to Security ▸ Code scanning
      actions: read             # the workflow's own run, for the upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - node_modules
              - research
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
